name: Bug
description: Report something that does not work as expected.
title: 'fix: '
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web
        - api
        - shared
        - ci
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device, browser and version, if relevant.
